<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Daily Spend</title>
  <meta name="description" content="Track your daily spending.">
  <meta name="theme-color" content="#F7F6EE">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="style.css?v=32">
</head>
<body>
<div id="app">

  <!-- ─── View: Home ──────────────────────────────────────────────────── -->
  <div id="home-view" class="view wash-hero active">
    <div class="grain"></div>

    <header class="home-header">
      <span class="home-title">Daily Spend</span>
    </header>

    <div class="ring-spacer-top"></div>

    <div class="ring-zone">
      <div class="ring-section">
        <div class="ring-wrap">
          <svg id="home-ring-svg" class="home-ring" viewBox="0 0 308 308">
            <!-- track -->
            <circle class="ring-track" cx="154" cy="154" r="142"
              fill="none" stroke="rgba(11,11,11,0.10)" stroke-width="6"/>
            <!-- fill arc — SVG is CSS-rotated -90deg, so 0deg = visual 12 o'clock -->
            <circle id="ring-fill" cx="154" cy="154" r="142"
              fill="none" stroke="var(--ink)" stroke-width="6"
              stroke-linecap="round"
              stroke-dasharray="0 892"/>
            <!-- overflow arc — shown in red when spending exceeds limit -->
            <circle id="ring-overflow" cx="154" cy="154" r="142"
              fill="none" stroke="#c0392b" stroke-width="6"
              stroke-linecap="round"
              stroke-dasharray="0 892"
              visibility="hidden"/>
            <!-- tip dot -->
            <circle id="ring-tip" cx="154" cy="12"
              r="6" fill="var(--accent)" stroke="var(--ink)" stroke-width="1.5"
              visibility="hidden"/>
          </svg>
          <div class="ring-center">
            <div class="ring-amount-wrap">
              <span id="ring-dollar" class="ring-dollar">$</span>
              <span id="home-remaining" class="ring-amount">0</span><span id="home-remaining-cents" class="ring-cents"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="limit-row">
      <button class="limit-badge" id="limit-badge">
        <span id="limit-badge-val">$50</span>
        <span class="limit-badge-label">limit</span>
        <svg class="chevron-icon" width="5" height="9" viewBox="0 0 7 12">
          <path d="M1 1l5 5-5 5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="today-section" id="today-section">
      <div class="today-section-head">
        <span>Today</span>
        <span id="today-total-val"></span>
      </div>
      <div id="today-list" class="today-list"></div>
    </div>

    <div class="ring-spacer-bot"></div>
  </div>

  <!-- ─── View: History ──────────────────────────────────────────────── -->
  <div id="history-view" class="view wash-hero">
    <div class="history-header-row">
      <div class="history-title">History</div>
      <span id="history-month-label" class="history-month-label"></span>
    </div>
    <div class="history-scroll">
      <div class="month-chart-section">
        <div class="month-chart-head">
          <span>Last 7 days</span>
          <span id="history-peak-label"></span>
        </div>
        <div id="month-bars" class="month-bars week-mode"></div>
        <div id="month-axis" class="month-axis"></div>
      </div>
      <div id="history-filters" class="history-filters"></div>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

  <!-- ─── View: Settings ─────────────────────────────────────────────── -->
  <div id="settings-view" class="view wash-hero">
    <div class="grain"></div>
    <div class="settings-header-row">
      <div class="settings-title">Settings</div>
    </div>
    <div class="settings-scroll">

      <div class="settings-section">
        <div class="settings-section-label">Budget</div>
        <div class="settings-card">
          <div class="settings-row" id="settings-limit-row">
            <span class="settings-row-label">Daily limit</span>
            <div class="settings-row-right">
              <span id="settings-limit-val"></span>
              <svg class="chevron-icon" width="7" height="12" viewBox="0 0 7 12">
                <path d="M1 1l5 5-5 5" stroke="var(--ink-muted)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
          <div class="settings-row last" id="settings-currency-row">
            <span class="settings-row-label">Currency</span>
            <div class="settings-row-right">
              <span id="settings-currency-val">USD · $</span>
              <svg class="chevron-icon" width="7" height="12" viewBox="0 0 7 12">
                <path d="M1 1l5 5-5 5" stroke="var(--ink-muted)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-section-label">Categories</div>
        <div class="settings-card" id="settings-cats-card"></div>
        <button class="add-cat-btn" id="add-cat-btn">+ Add category</button>
      </div>

      <div class="settings-section">
        <div class="settings-section-label">Appearance</div>
        <div class="settings-card">
          <div class="settings-row last" id="settings-color-row">
            <span class="settings-row-label">Color</span>
            <div class="settings-row-right">
              <span id="settings-color-dot" class="color-swatch-dot"></span>
              <svg class="chevron-icon" width="7" height="12" viewBox="0 0 7 12">
                <path d="M1 1l5 5-5 5" stroke="var(--ink-muted)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-card">
          <div class="settings-row last danger" id="settings-reset-row">
            <span class="settings-row-label">Clear all data</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ─── Sheet tab (drag/tap to open add sheet) ────────────────────── -->
  <div id="sheet-tab">
    <span class="sheet-tab-plus">+</span>
  </div>

  <!-- ─── Bottom dock (shared) ───────────────────────────────────────── -->
  <div id="bottom-dock">
    <button class="nav-glyph active" data-view="home">
      <svg width="14" height="14" viewBox="0 0 14 14">
        <circle cx="7" cy="7" r="3" fill="currentColor"/>
      </svg>
    </button>
    <button class="nav-glyph" data-view="history">
      <svg width="14" height="14" viewBox="0 0 14 14">
        <g fill="currentColor">
          <rect x="2" y="9" width="2.5" height="3" rx="0.5"/>
          <rect x="6" y="6" width="2.5" height="6" rx="0.5"/>
          <rect x="10" y="3" width="2.5" height="9" rx="0.5"/>
        </g>
      </svg>
    </button>
    <button class="nav-glyph" data-view="settings">
      <svg width="14" height="14" viewBox="0 0 14 14">
        <g fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="7" cy="7" r="2.2"/>
          <path d="M7 1v1.6M7 11.4V13M11.2 7H13M1 7h1.8M10 4l1.1-1.1M2.9 11.1L4 10M10 10l1.1 1.1M2.9 2.9L4 4"/>
        </g>
      </svg>
    </button>
  </div>

  <!-- ─── Overlay: Add expense sheet ─────────────────────────────────── -->
  <div id="add-overlay" class="overlay">
    <div class="overlay-backdrop" id="add-backdrop"></div>
    <div class="add-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-amount">
        <div class="amount-display">
          <span class="amount-dollar">$</span>
          <span id="sheet-amount-val">0</span>
          <span class="amount-cursor"></span>
        </div>
      </div>
      <div id="category-chips" class="category-chips"></div>
      <div id="numpad" class="numpad"></div>
      <button class="track-btn" id="track-btn">Track it — $0.00</button>
    </div>
  </div>

  <!-- ─── Overlay: Edit daily limit ──────────────────────────────────── -->
  <div id="edit-limit-overlay" class="overlay">
    <div class="overlay-backdrop" id="edit-limit-backdrop"></div>
    <div class="glass-modal">
      <div class="glass-gloss"></div>
      <div style="position:relative">
        <div class="edit-limit-label">Daily limit</div>
        <div class="edit-limit-amount-row">
          <span class="edit-limit-dollar">$</span>
          <input id="edit-limit-input" class="edit-limit-input" type="number" min="1" max="99999" inputmode="decimal">
          <span id="edit-limit-was" class="edit-limit-was"></span>
        </div>
        <div class="modal-actions">
          <button class="btn-ghost" id="edit-limit-cancel">Cancel</button>
          <button class="btn-ink" id="edit-limit-save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Overlay: Color picker ──────────────────────────────────────── -->
  <div id="color-overlay" class="overlay">
    <div class="overlay-backdrop" id="color-backdrop"></div>
    <div class="glass-modal">
      <div class="glass-gloss"></div>
      <div style="position:relative">
        <div class="color-modal-header">
          <span class="color-modal-title">Color</span>
        </div>
        <div class="accent-section-label">Accent</div>
        <div id="accent-swatches" class="accent-swatches"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="color-cancel">Cancel</button>
          <button class="btn-ink" id="color-save">Apply</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Overlay: Currency picker ─────────────────────────────────────── -->
  <div id="currency-overlay" class="overlay">
    <div class="overlay-backdrop" id="currency-backdrop"></div>
    <div class="glass-modal">
      <div class="glass-gloss"></div>
      <div style="position:relative">
        <div class="color-modal-header">
          <span class="color-modal-title">Currency</span>
        </div>
        <div id="currency-options" class="currency-options"></div>
        <div class="modal-actions">
          <button class="btn-ghost" id="currency-cancel">Cancel</button>
          <button class="btn-ink" id="currency-save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Overlay: Custom one-time label ───────────────────────────────────── -->
  <div id="custom-cat-overlay" class="overlay">
    <div class="overlay-backdrop" id="custom-cat-backdrop"></div>
    <div class="glass-modal">
      <div class="glass-gloss"></div>
      <div style="position:relative">
        <div class="edit-limit-label">One-time label</div>
        <input id="custom-cat-input" class="custom-cat-input"
               type="text" placeholder="e.g. Socks" maxlength="32" autocomplete="off">
        <div class="modal-actions">
          <button class="btn-ghost" id="custom-cat-cancel">Cancel</button>
          <button class="btn-ink" id="custom-cat-done">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ─── Overlay: Edit expense entry ───────────────────────────────────────── -->
  <div id="edit-entry-overlay" class="overlay">
    <div class="overlay-backdrop" id="edit-entry-backdrop"></div>
    <div class="edit-entry-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-amount">
        <div class="amount-display">
          <span class="amount-dollar" id="edit-amount-dollar">$</span>
          <span id="edit-amount-val">0</span>
          <span class="amount-cursor"></span>
        </div>
      </div>
      <div id="edit-category-chips" class="category-chips"></div>
      <div id="edit-numpad" class="numpad"></div>
      <div class="edit-entry-actions">
        <button class="edit-delete-btn" id="edit-delete-btn">Delete</button>
        <button class="track-btn" id="edit-save-btn">Save changes</button>
      </div>
    </div>
  </div>

</div><!-- #app -->

<script src="app.js?v=21"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
